<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bush GLTF Renderer - PS1 Style</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #333;
            font-family: monospace;
            overflow: hidden;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
        }
        
        #canvas {
            display: block;
        }
        
        .status {
            margin: 5px 0;
            padding: 3px 0;
        }
        
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Bush GLTF Renderer</h3>
        <p>Focused PS1-Style Bush Loading</p>
        <p>Mouse: Rotate | Scroll: Zoom</p>
        <div id="status-container">
            <div id="loading-status" class="status info">Initializing...</div>
            <div id="texture-status" class="status">Texture: Not loaded</div>
            <div id="material-status" class="status">Material: Not processed</div>
            <div id="model-status" class="status">Model: Not loaded</div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Status logging
        function updateStatus(elementId, message, className = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${className}`;
            console.log(`[${elementId}] ${message}`);
        }
        
        updateStatus('loading-status', 'Setting up Three.js scene...', 'info');
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x404040);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Lighting setup for PS1 style
        const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 512;
        directionalLight.shadow.mapSize.height = 512;
        scene.add(directionalLight);
        
        // Ground plane for reference
        const groundGeometry = new THREE.PlaneGeometry(10, 10);
        const groundMaterial = new THREE.MeshLambertMaterial({ 
            color: 0x2a5a2a,
            transparent: true,
            opacity: 0.7
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(10, 20, 0x555555, 0x333333);
        scene.add(gridHelper);
        
        updateStatus('loading-status', 'Scene setup complete', 'success');
        
        // Pre-load texture before GLTF
        updateStatus('texture-status', 'Loading bush texture...', 'info');
        
        const textureLoader = new THREE.TextureLoader();
        let bushTexture = null;
        
        textureLoader.load(
            './public/models/bush/textures/Material.001_baseColor.png',
            function(texture) {
                // Apply PS1-style filtering as defined in GLTF
                texture.magFilter = THREE.NearestFilter; // 9728 in GLTF
                texture.minFilter = THREE.NearestFilter; // 9728 in GLTF  
                texture.generateMipmaps = false;
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = THREE.RepeatWrapping; // 10497 in GLTF
                texture.wrapT = THREE.RepeatWrapping; // 10497 in GLTF
                
                bushTexture = texture;
                updateStatus('texture-status', 'Bush texture loaded successfully', 'success');
                
                console.log('Texture loaded:', texture);
                console.log('Texture image:', texture.image);
                console.log('Texture size:', texture.image.width, 'x', texture.image.height);
                
                // Now load the GLTF
                loadBushGLTF();
            },
            function(progress) {
                const percent = Math.round((progress.loaded / progress.total) * 100);
                updateStatus('texture-status', `Loading texture... ${percent}%`, 'info');
            },
            function(error) {
                console.error('Texture loading error:', error);
                updateStatus('texture-status', 'Texture loading failed - proceeding without texture', 'warning');
                
                // Try alternative texture paths
                tryAlternativeTextures();
            }
        );
        
        // Try alternative texture paths
        function tryAlternativeTextures() {
            const alternativePaths = [
                './public/models/bush/textures/Material.001_baseColor - Copy.png',
                './public/models/bush/textures/Material.001_baseColor - Copy (2).png',
                './public/models/bush/textures/Material.001_baseColor - Copy - Copy.png'
            ];
            
            let currentIndex = 0;
            
            function tryNext() {
                if (currentIndex >= alternativePaths.length) {
                    updateStatus('texture-status', 'All texture paths failed', 'error');
                    loadBushGLTF(); // Load without texture
                    return;
                }
                
                const path = alternativePaths[currentIndex];
                updateStatus('texture-status', `Trying alternative: ${path.split('/').pop()}`, 'info');
                
                textureLoader.load(
                    path,
                    function(texture) {
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.NearestFilter;
                        texture.generateMipmaps = false;
                        texture.colorSpace = THREE.SRGBColorSpace;
                        texture.wrapS = THREE.RepeatWrapping;
                        texture.wrapT = THREE.RepeatWrapping;
                        
                        bushTexture = texture;
                        updateStatus('texture-status', `Alternative texture loaded: ${path.split('/').pop()}`, 'success');
                        loadBushGLTF();
                    },
                    undefined,
                    function(error) {
                        currentIndex++;
                        tryNext();
                    }
                );
            }
            
            tryNext();
        }
        
        // GLTF loader with KHR_materials_unlit support
        function loadBushGLTF() {
            updateStatus('model-status', 'Loading bush GLTF...', 'info');
            
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                './public/models/bush/scene.gltf',
                function(gltf) {
                    updateStatus('model-status', 'GLTF loaded, processing materials...', 'info');
                    
                    const bushModel = gltf.scene;
                    
                    console.log('=== GLTF Analysis ===');
                    console.log('Scene:', bushModel);
                    console.log('Animations:', gltf.animations);
                    console.log('Cameras:', gltf.cameras);
                    console.log('Scene nodes:', bushModel.children);
                    
                    // Process materials with KHR_materials_unlit support
                    let meshCount = 0;
                    let materialCount = 0;
                    
                    bushModel.traverse((child) => {
                        if (child.isMesh) {
                            meshCount++;
                            console.log(`\\n=== Mesh ${meshCount}: ${child.name || 'unnamed'} ===`);
                            console.log('Geometry:', child.geometry);
                            console.log('Original material:', child.material);
                            
                            // Handle both single materials and arrays
                            const materials = Array.isArray(child.material) ? child.material : [child.material];
                            const newMaterials = [];
                            
                            materials.forEach((originalMaterial, index) => {
                                materialCount++;
                                console.log(`\\n--- Processing Material ${materialCount} ---`);
                                console.log('Type:', originalMaterial.type);
                                console.log('Extensions:', originalMaterial.userData?.gltfExtensions);
                                
                                // Create PS1-style unlit material
                                let newMaterial;
                                
                                // Check for unlit extension (as specified in GLTF)
                                const hasUnlitExtension = originalMaterial.userData?.gltfExtensions?.KHR_materials_unlit;
                                
                                if (hasUnlitExtension) {
                                    console.log('Using MeshBasicMaterial for unlit extension');
                                    newMaterial = new THREE.MeshBasicMaterial({
                                        map: bushTexture,
                                        side: THREE.DoubleSide // GLTF specifies doubleSided: true
                                    });
                                } else {
                                    console.log('Using MeshLambertMaterial with flat shading');
                                    newMaterial = new THREE.MeshLambertMaterial({
                                        map: bushTexture,
                                        flatShading: true,
                                        side: THREE.DoubleSide
                                    });
                                }
                                
                                // Apply base color if available
                                if (originalMaterial.color) {
                                    newMaterial.color.copy(originalMaterial.color);
                                    console.log('Applied base color:', originalMaterial.color);
                                } else {
                                    // Default to green for bush
                                    newMaterial.color.setHex(0x4a7c59);
                                    console.log('Applied default green color');
                                }
                                
                                // Handle transparency
                                if (originalMaterial.transparent) {
                                    newMaterial.transparent = true;
                                    newMaterial.opacity = originalMaterial.opacity || 1.0;
                                }
                                
                                console.log('Final material:', newMaterial);
                                newMaterials.push(newMaterial);
                            });
                            
                            // Apply materials
                            child.material = newMaterials.length === 1 ? newMaterials[0] : newMaterials;
                            
                            // Enable shadows
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    // Apply GLTF root transform (from node matrix)
                    if (gltf.scene.matrix) {
                        bushModel.matrix.copy(gltf.scene.matrix);
                        bushModel.matrix.decompose(bushModel.position, bushModel.quaternion, bushModel.scale);
                    }
                    
                    // Scale and position for better viewing
                    const box = new THREE.Box3().setFromObject(bushModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    console.log('Model bounding box:', box);
                    console.log('Model size:', size);
                    console.log('Model center:', center);
                    
                    // Center the model
                    bushModel.position.sub(center);
                    
                    // Scale to reasonable size (about 1.5 units tall)
                    const maxDimension = Math.max(size.x, size.y, size.z);
                    const targetSize = 1.5;
                    const scale = targetSize / maxDimension;
                    bushModel.scale.setScalar(scale);
                    
                    // Position on ground
                    bushModel.position.y = 0;
                    
                    scene.add(bushModel);
                    
                    updateStatus('model-status', `Bush loaded! ${meshCount} meshes, ${materialCount} materials`, 'success');
                    updateStatus('material-status', `Materials processed with ${bushTexture ? 'texture' : 'fallback color'}`, 'success');
                    
                    console.log('Bush model added to scene:', bushModel);
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    updateStatus('model-status', `Loading GLTF... ${percent}%`, 'info');
                },
                function(error) {
                    console.error('GLTF loading error:', error);
                    updateStatus('model-status', `GLTF loading failed: ${error.message}`, 'error');
                    
                    // Create fallback bush
                    createFallbackBush();
                }
            );
        }
        
        // Fallback bush creation
        function createFallbackBush() {
            updateStatus('model-status', 'Creating fallback bush geometry...', 'warning');
            
            const bushGroup = new THREE.Group();
            
            // Main bush body
            const bodyGeometry = new THREE.CylinderGeometry(0.6, 0.8, 1.2, 8, 2);
            const bodyMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x4a7c59,
                flatShading: true
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            bushGroup.add(body);
            
            // Bush top (foliage)
            const topGeometry = new THREE.SphereGeometry(0.7, 8, 6);
            const topMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x5d8a3a,
                flatShading: true
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 0.8;
            top.castShadow = true;
            bushGroup.add(top);
            
            bushGroup.position.y = 0.6;
            scene.add(bushGroup);
            
            updateStatus('model-status', 'Fallback bush created', 'success');
            updateStatus('material-status', 'Using procedural materials', 'warning');
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start animation
        animate();
        
        console.log('Bush GLTF Renderer initialized');
        console.log('Expected paths:');
        console.log('- GLTF: ./public/models/bush/scene.gltf');
        console.log('- Texture: ./public/models/bush/textures/Material.001_baseColor.png');
    </script>
</body>
</html>
